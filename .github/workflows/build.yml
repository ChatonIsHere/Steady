name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # `full`, because main's subset lacks Township.Core.Runtime.
      - uses: actions/checkout@v4
        with:
          repository: ChatonIsHere/att-stubs
          ref: full
          path: att-stubs
      - run: dotnet build -c Release "-p:GameDir=${{ github.workspace }}\att-stubs"
      - uses: actions/upload-artifact@v4
        with:
          name: Steady
          path: bin/Release/Steady.dll
      # Releases main's <Version> if it hasn't been released yet.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Steady.csproj)
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" bin/Release/Steady.dll --target "$GITHUB_SHA" --title "Steady $v" --generate-notes
